<!DOCTYPE html>
<html>

<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- Esta es la línea que Google muestra bajo el enlace en sus resultados. Traía la frase que genera
       `flutter create` por omisión —«A new Flutter project…»—, que salía publicada tal cual. -->
  <meta name="description"
    content="Plataforma operativa interna de SI SOL. Acceso exclusivo para colaboradores.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="favicon20.jpg" type="image/jpeg">

  <!-- Meta tags for PWA -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Sistemassi">

  <!-- El título es el enlace azul del resultado. Google a veces lo reescribe si cree que otro
       describe mejor la página, pero éste es el que se le propone. -->
  <title>Sistemassi · Plataforma interna SI SOL</title>
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
</head>

<body>
  <div id="loading"
    style="display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif;">
    <script>
      console.log("Página cargada. Iniciando bootstrap de Flutter...");
      window.addEventListener('load', function () {
        console.log("Carga de ventana completa.");
      });
    </script>
    <!-- Sin `?v=...`.
         Aqui habia `flutter_bootstrap.js?v=d023c6a`, puesto en la «carga inicial» del 22/04/2026 y
         nunca tocado despues. `d023c6a` no es ningun commit de este repositorio: era un literal fijo.
         Y `flutter_bootstrap.js` lo GENERA `flutter build web` en cada compilacion, con el hash del
         `main.dart.js` de ese despliegue dentro.
         Una URL que no cambia con contenido que si cambia es una caja fuerte para la version vieja:
         el navegador servia ese archivo de su cache y con el el bundle del dia en que la persona entro
         por primera vez. De ahi los «ya lo subiste pero no lo veo» de cada despliegue.
         Quien decide que se puede cachear es `_headers`, al lado de este archivo. -->
    <script src="flutter_bootstrap.js" async></script>
</body>

</html>
